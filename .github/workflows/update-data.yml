name: Update Directory Data

on:
  schedule:
    # FMHY + Awesome Lists：每周一凌晨 2 点（北京时间）
    - cron: '0 18 * * 1'
    # GitHub Stars + Product Hunt：每天凌晨 2 点（北京时间）
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-fmhy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Update FMHY data
        run: npm run update:fmhy
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/fmhy-*.json
          git diff --staged --quiet || (git commit -m "Auto-update: FMHY data ($(date +'%Y-%m-%d'))" && git push)

  update-github-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Update GitHub Stars
        run: npm run update:github-stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/fmhy-resources.json
          git diff --staged --quiet || (git commit -m "Auto-update: GitHub Stars ($(date +'%Y-%m-%d'))" && git push)

  update-producthunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Update Product Hunt data
        run: npm run update:producthunt
        env:
          PRODUCTHUNT_API_KEY: ${{ secrets.PRODUCTHUNT_API_KEY }}
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/fmhy-resources.json
          git diff --staged --quiet || (git commit -m "Auto-update: Product Hunt data ($(date +'%Y-%m-%d'))" && git push)

  update-alternativeto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Update AlternativeTo data
        run: npm run update:alternativeto
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/alternatives-*.json lib/alternatives.ts
          git diff --staged --quiet || (git commit -m "Auto-update: AlternativeTo data ($(date +'%Y-%m-%d'))" && git push)

  update-awesome-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Update Awesome Lists data
        run: npm run update:awesome-lists
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/*-resources.json public/data/all-sources-index.json
          git diff --staged --quiet || (git commit -m "Auto-update: Awesome Lists data ($(date +'%Y-%m-%d'))" && git push)
