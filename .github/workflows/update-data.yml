name: Update Directory Data

on:
  schedule:
    # 数据更新：每天北京时间 凌晨 2 点（UTC 18:00）
    - cron: '0 18 * * *'
    # 内容生成：每周一 北京时间 凌晨 2 点（UTC 每周一 18:00）
    - cron: '0 18 * * 1'
  workflow_dispatch: # 允许手动触发

jobs:
  update-fmhy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update FMHY data
        run: node scripts/sync-fmhy.mjs

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/fmhy-*.json
          git diff --staged --quiet || (git commit -m "Auto-update: FMHY data ($(date +'%Y-%m-%d'))" && git push)

  update-github-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update GitHub Stars
        run: node scripts/update-github-stars.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/fmhy-resources.json
          git diff --staged --quiet || (git commit -m "Auto-update: GitHub Stars ($(date +'%Y-%m-%d'))" && git push)

  update-alternativeto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update AlternativeTo data
        run: node scripts/generate-alternatives-from-fmhy.mjs

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/alternatives-*.json lib/alternatives.ts
          git diff --staged --quiet || (git commit -m "Auto-update: AlternativeTo data ($(date +'%Y-%m-%d'))" && git push)

  update-awesome-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Awesome Lists data
        run: node scripts/scrape-awesome-lists.mjs

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/awesome-selfhosted-resources.json public/data/free-for-dev-resources.json
          git diff --staged --quiet || (git commit -m "Auto-update: Awesome Lists data ($(date +'%Y-%m-%d'))" && git push)

  update-producthunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Product Hunt data
        run: node scripts/update-producthunt.mjs
        env:
          PRODUCTHUNT_API_KEY: ${{ secrets.PRODUCTHUNT_API_KEY }}

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/producthunt-*.json
          git diff --staged --quiet || (git commit -m "Auto-update: Product Hunt data ($(date +'%Y-%m-%d'))" && git push)

  generate-content:
    runs-on: ubuntu-latest
    needs: [update-fmhy, update-github-stars, update-alternativeto, update-awesome-lists]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate content by category (ensure 10+ per category)
        run: node scripts/populate-content-by-category.mjs 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate content from real data (FMHY + GitHub README)
        run: node scripts/populate-content-v2.mjs 500
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import Awesome-Selfhosted data
        run: node scripts/import-selfhosted-to-content.mjs

      - name: Import Free-for-Dev data
        run: node scripts/import-freefordev-to-content.mjs

      - name: Merge AlternativeTo data
        run: node scripts/merge-alternativeto-data.mjs

      - name: Scrape resource descriptions (official websites)
        run: node scripts/scrape-resource-descriptions.mjs 100

      - name: Commit and push generated content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/data/generated-content/*.json
          git diff --staged --quiet || (git commit -m "Auto-generate: content ($(date +'%Y-%m-%d'))" && git push)
