name: Daily Data Sync

on:
  schedule:
    # 每天北京时间 凌晨 2 点（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  # ── Job 1: 同步 FMHY 数据 ──────────────────────────
  sync-fmhy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync FMHY data
        run: node scripts/sync-fmhy.mjs
        timeout-minutes: 10

      - name: Commit & push FMHY data
        run: |
          git config user.name "craftisle-bot"
          git config user.email "bot@craftisle.com"
          git add public/data/fmhy-*.json || true
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync FMHY ($(date +'%Y-%m-%d'))" && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: 更新 GitHub Stars（增量，分批跑） ─────────
  update-stars:
    runs-on: ubuntu-latest
    needs: sync-fmhy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update GitHub Stars（增量分批，跑 2000 个/次）
        run: node scripts/update-github-stars.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_SIZE: "2000"
        timeout-minutes: 30

      - name: Commit & push stars data
        run: |
          git config user.name "craftisle-bot"
          git config user.email "bot@craftisle.com"
          git add public/data/fmhy-resources.json public/data/github-stars-checkpoint.json || true
          git diff --staged --quiet || (git commit -m "chore(data): update GitHub stars ($(date +'%Y-%m-%d'))" && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: 生成首页动态板块（每周一） ─────────────
  build-home-blocks:
    runs-on: ubuntu-latest
    # 每周一北京时间 09:00（UTC 周一 01:00）
    if: github.event.schedule == '0 18 * * *' && github.event.schedule != '' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build homepage blocks
        run: node scripts/build-home-blocks.mjs
        timeout-minutes: 5

      - name: Commit & push home-blocks.json
        run: |
          git config user.name "craftisle-bot"
          git config user.email "bot@craftisle.com"
          git add public/data/home-blocks.json || true
          git diff --staged --quiet || (git commit -m "chore(data): update homepage blocks ($(date +'%Y-%m-%d'))" && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 4: 生成替代品映射（从 batch 文件合并） ──
  update-alternatives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge alternatives from batch files
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.readdirSync('public/data')
            .filter(f => f.startsWith('alternatives-batch') && f.endsWith('.json') && !f.includes('sample'))
            .sort();
          const merged = {};
          for(const f of files) {
            const data = JSON.parse(fs.readFileSync('public/data/'+f,'utf-8'));
            for(const [key, entry] of Object.entries(data)) {
              if(entry.paidTool && Array.isArray(entry.alternatives) && entry.alternatives.length > 0) {
                const freeNames = entry.alternatives.map(a => a.name).filter(Boolean);
                if(!merged[entry.paidTool] && freeNames.length > 0) {
                  merged[entry.paidTool] = freeNames;
                }
              }
            }
          }
          console.log('Merged:', Object.keys(merged).length, 'alternatives');
          fs.writeFileSync('public/data/alternatives.json', JSON.stringify(merged, null, 2));
          "

      - name: Commit & push alternatives
        run: |
          git config user.name "craftisle-bot"
          git config user.email "bot@craftisle.com"
          git add public/data/alternatives.json || true
          git diff --staged --quiet || (git commit -m "chore(data): update alternatives ($(date +'%Y-%m-%d'))" && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 5: 抓取 Awesome Lists ─────────────────────
  update-awesome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape Awesome Lists
        run: node scripts/scrape-awesome-lists.mjs
        timeout-minutes: 10

      - name: Commit & push awesome data
        run: |
          git config user.name "craftisle-bot"
          git config user.email "bot@craftisle.com"
          git add public/data/awesome-*.json || true
          git diff --staged --quiet || (git commit -m "chore(data): update Awesome Lists ($(date +'%Y-%m-%d'))" && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
