name: Weekly Content Generation

on:
  schedule:
    # 每周一北京时间 凌晨 3 点（UTC 每周日 19:00）
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest data
        run: git pull origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 步骤 1：按分类补充内容（不需要 AI） ─────────────
      - name: Populate content by category
        run: node scripts/populate-content-by-category.mjs 10
        timeout-minutes: 10
        continue-on-error: true

      # ── 步骤 2：导入 Awesome-Selfhosted 数据 ─────────────
      - name: Import Awesome-Selfhosted
        run: node scripts/import-selfhosted-to-content.mjs
        timeout-minutes: 5
        continue-on-error: true

      # ── 步骤 3：导入 Free-for-Dev 数据 ────────────────
      - name: Import Free-for-Dev
        run: node scripts/import-freefordev-to-content.mjs
        timeout-minutes: 5
        continue-on-error: true

      # ── 步骤 4：合并 AlternativeTo 数据 ─────────────────
      - name: Merge AlternativeTo data
        run: node scripts/merge-alternativeto-data.mjs
        timeout-minutes: 5
        continue-on-error: true

      # ── 步骤 5：AI 生成内容（需要 OPENAI_API_KEY） ─────
      # 如果没配置 API Key，此步骤会跳过（continue-on-error）
      - name: AI generate content (FMHY + GitHub README)
        run: node scripts/populate-content-v2.mjs 200
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60
        continue-on-error: true

      # ── 提交并推送 ────────────────────────────────────────
      - name: Commit & push generated content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "craftisle-bot"
          git config user.email "bot@craftisle.com"
          git add public/data/generated-content/ || true
          git add .contentlayer/ || true
          git diff --staged --quiet || (git commit -m "chore(content): weekly auto-generate ($(date +'%Y-%m-%d'))" && git push)
        continue-on-error: true
