name: SEO Auto-Optimize

# 周期性基于真实 GSC 分析自动优化站点 metadata，并回写提交（触发 Vercel 重建）。
# 安全设计：
#   - 仅在 lib/seo/page-meta.ts 实际变更时才提交，否则 no-op；
#   - 无 GSC 凭证时脚本走 no_data 分支、不产生任何编辑，不会误改；
#   - 应用前自动备份 + tsc 校验，失败回滚（见 lib/seo/optimizer.ts）。
on:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run auto-optimizer (apply)
        env:
          GSC_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GSC_SERVICE_ACCOUNT_EMAIL }}
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: npx tsx scripts/auto-optimize.ts --apply
      - name: Commit metadata changes if any
        run: |
          if [[ -n "$(git status --porcelain lib/seo/page-meta.ts)" ]]; then
            git config user.name "seo-bot"
            git config user.email "seo-bot@users.noreply.github.com"
            git add lib/seo/page-meta.ts
            git commit -m "chore(seo): auto-optimize page metadata from GSC analysis"
            git push
            echo "Committed metadata optimization."
          else
            echo "No metadata changes — nothing to commit."
          fi
